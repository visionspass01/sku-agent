name: verify

# 为什么叫 verify 而不是 ci：这个名字描述的是它**验什么**（lint + 全量用例 + 覆盖率门槛 + 评测门槛
# + MySQL 方言），而不是"流水线"这个泛称。历史上的 `ci.yml` 已经删掉，本项目只保留这一条流水线，
# 免得同一件事出现两份定义、推一次跑两遍。
#
# 触发面：
# - main / master：合并后的守门；
# - `ci/**`：预检分支（先在分支上跑绿，再快进 main，main 历史里不留红叉）；
# - pull_request / workflow_dispatch：评审与手动重跑。
on:
  push:
    branches: [main, master, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # 脚本（eval_* / verify_stack）按 PYTHONPATH 找包；pytest 自己配了 pythonpath
  PYTHONPATH: ${{ github.workspace }}/src
  # 注意：这里**不要**设 COVERAGE_FILE。覆盖率分片名由两个测试 job 各自指定
  # （.coverage.sku / .coverage.image），coverage-gate 里 `coverage combine` 按默认的
  # `.coverage.*` 前缀来找分片；一旦全局设了 COVERAGE_FILE，combine 会去找
  # `.coverage.default.*`，找不到分片直接失败。

jobs:
  # ================================================================ 1. 静态检查 + 前端冒烟（最快，先失败）
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（ruff：import 顺序 / 未用变量 / 未定义名等）
        run: python -m ruff check src tests scripts

      - name: Compile all sources（语法检查，早于测试快速失败）
        run: python -m compileall -q src scripts

      # 这一层专治「本地抄一份命令跑绿、推上去才炸」的那类问题：
      # 隐藏 artifact、COVERAGE_FILE 前缀、artifact 名字对不上、步骤引用错文件名、门槛被调低。
      - name: Workflow 自检（6 条静态规则，读 .github/workflows/*.yml）
        run: python scripts/check_ci_config.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend DOM smoke（SKU 看板）
        run: node scripts/ui_smoke.js

      - name: Frontend DOM smoke（生图工作台）
        run: node scripts/ui_smoke_image.js

  # ================================================================ 2. SKU 侧用例（不含 image_*）
  test-sku:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: .coverage.sku
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: "SKU 侧用例（离线：FakeLLM / MockTransport / fakeredis / qdrant local）"
        run: |
          set -o pipefail
          python -m pytest -q --ignore-glob="tests/test_image_*.py" \
            --cov=src/app --cov-report= -rf 2>&1 | tee pytest-sku.log
          status=${PIPESTATUS[0]}
          # 失败时把失败用例 + 日志尾部写进注解（公开可见），不用下载日志才能定位
          if [ "$status" -ne 0 ]; then python scripts/ci_annotate.py pytest-sku.log; fi
          exit "$status"

      - name: 上传覆盖率分片
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sku
          path: .coverage.sku
          # .coverage.* 是隐藏文件，upload-artifact v4.4+ 默认跳过隐藏文件
          include-hidden-files: true
          if-no-files-found: error

  # ================================================================ 3. 生图 Agent 用例（image_*）
  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: .coverage.image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: "生图 Agent 用例（fake provider / memory 存储 / 无外网）"
        run: |
          set -o pipefail
          python -m pytest -q tests/test_image_*.py \
            --cov=src/app --cov-report= -rf 2>&1 | tee pytest-image.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then python scripts/ci_annotate.py pytest-image.log; fi
          exit "$status"

      - name: 上传覆盖率分片
        uses: actions/upload-artifact@v4
        with:
          name: coverage-image
          path: .coverage.image
          # 同上：隐藏文件默认被跳过
          include-hidden-files: true
          if-no-files-found: error

  # ================================================================ 4. 覆盖率门槛（合并两个分片）
  coverage-gate:
    needs: [test-sku, test-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 汇总两个分片
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .

      - name: 合并 + 覆盖率门槛（≥ 80%，口径不变）
        run: |
          set -o pipefail
          ls -l .coverage* || true
          { python -m coverage combine && python -m coverage report --fail-under=80 --show-missing; } \
            2>&1 | tee coverage-gate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then python scripts/ci_annotate.py coverage-gate.log; fi
          exit "$status"

  # ================================================================ 5. 评测/自检门槛（需要初始化演示库）
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # 检索评测读的是真实库里的 kb_chunk（知识库索引），全新 checkout 里还没有这张表，
      # 所以先跑一次初始化（建表 + 300 SKU + KB 索引；data/ 是 gitignored，不会污染仓库）。
      - name: 初始化演示数据（评测门槛需要知识库索引）
        run: python scripts/init_db.py

      - name: 答案质量判定器自检（离线、确定性）
        run: python scripts/eval_agent_answers.py --offline

      - name: 检索评测门槛（Recall@1 ≥ 0.8）
        run: python scripts/eval_rag.py --min-recall 0.8

      - name: Agent 路由准确率门槛（≥ 0.9）
        run: python scripts/eval_routing.py --min-accuracy 0.9

      - name: 工具部门作用域门槛（27 工具 × 3 账号 / 34 用例，必须 100%）
        run: python scripts/eval_permissions.py --min-pass 1.0

      - name: 出口溯源闸门门槛（准确率 ≥ 0.9、误杀率 ≤ 0.1）
        run: python scripts/eval_grounding.py --max-false-positive 0.1

      - name: 中台治理门槛（身份/scope/部门/配额/审计/并发，必须 100%）
        run: python scripts/eval_platform_governance.py --min-pass 1.0

      - name: Agent 工具面/写路径门禁（描述+参数说明/幂等键/未知工具契约/证据下限/聚合口径）
        run: python scripts/eval_agent_tooling.py --min-pass 1.0

      - name: 并发写自检（两个 agent 写同一份档案不静默覆盖）
        run: python scripts/verify_concurrent_writes.py

  # ================================================================ 6. 生产库方言（MySQL）
  # 只跑 SQLite 的话，MySQL 方言（ensure_columns 的 CREATE INDEX、utf8mb4、事务隔离）
  # 从来没被验证过。这里用 service container 跑关键子集。
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sku_ci
          MYSQL_USER: sku
          MYSQL_PASSWORD: sku
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usku -psku"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      TEST_DATABASE_URL: mysql+pymysql://sku:sku@127.0.0.1:3306/sku_ci?charset=utf8mb4
      TEST_SEED_SKUS: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # 容器健康检查只看 `mysqladmin ping`，它在 mysqld 刚起、还没建好表空间时也可能通；
      # 测试里第一步就是 init_schema，抢跑会直接整片红（历史故障：job 只跑了 71 秒）。
      # 这里用 pymysql（本来就是依赖）真连一次库再放行，最多等 90 秒。
      - name: 等待 MySQL 真正可连（不只看 healthcheck）
        run: |
          python - <<'PY'
          import sys
          import time

          import pymysql

          last = None
          for attempt in range(1, 91):
              try:
                  conn = pymysql.connect(host="127.0.0.1", port=3306, user="sku", password="sku",
                                         database="sku_ci", connect_timeout=3)
                  with conn.cursor() as cur:
                      cur.execute("SELECT 1")
                      cur.fetchone()
                  conn.close()
                  print(f"MySQL 可连（第 {attempt} 次尝试）")
                  break
              except Exception as exc:  # noqa: BLE001
                  last = exc
                  time.sleep(1)
          else:
              print(f"MySQL 90 秒内仍不可连：{last!r}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Tests on MySQL（档案/巡检/接口/记忆/检索索引/看板 + 中台治理）
        run: |
          set -o pipefail
          python -m pytest -q -rf \
            tests/test_analysis_idempotent.py \
            tests/test_analysis_concurrency.py \
            tests/test_patrol.py \
            tests/test_api.py \
            tests/test_chat_store.py \
            tests/test_memory_layers.py \
            tests/test_rag_index_reconcile.py \
            tests/test_screening.py \
            tests/test_metrics_cards.py \
            tests/test_platform.py \
            tests/test_platform_authz.py \
            tests/test_platform_governance.py \
            tests/test_demo_catalog_contract.py \
            2>&1 | tee pytest-mysql.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then python scripts/ci_annotate.py pytest-mysql.log; fi
          exit "$status"
