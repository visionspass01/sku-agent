name: gate

# 本流水线按**项目结构从外到内**依次验证，step 名就是它验的功能面：
#
#   ① static   静态与契约      src/ tests/ scripts/ 的规范、语法、workflow 自身、web/ 冒烟
#   ② sku      数据中台 + SKU Agent（src/app/**）
#                中台：身份/作用域/契约/治理 → 指标口径/数据质量/巡检/可观测
#                Agent：图/路由/技能/工具面 → 取数分析/档案/前端 → RAG → 记忆会话 → 基础设施
#   ③ image    生图 Agent（src/app/agents_image/**）
#                规划 Prompt → 生成重试 → 门禁 Critic → Reflexion → 任务状态机 → worker 服务化 → API/前端
#   ④ coverage 覆盖率门槛（合并 ②③ 的分片，≥ 80%，口径不变）
#   ⑤ eval     评测/自检门槛（检索→路由→权限→溯源→治理→工具面→并发写）
#   ⑥ mysql    生产库方言（MySQL 8.0 service container）
#
# 分组定义只在 `scripts/ci_split.py` 一处；`python scripts/ci_test_group.py sku:rag` 跑某一组。
#
# 触发面：main/master（守门）、`ci/**`（预检分支：先跑绿再快进 main，main 历史不留红叉）、
# PR、手动。
on:
  push:
    branches: [main, master, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # 脚本（eval_* / verify_stack）按 PYTHONPATH 找包；pytest 自己配了 pythonpath
  PYTHONPATH: ${{ github.workspace }}/src
  # 注意：这里**不要**设 COVERAGE_FILE。每个测试 step 自己写
  # `.coverage.<suite>.<group>` 分片，coverage 门槛 job 里 `coverage combine`
  # 按默认的 `.coverage.*` 前缀统一收集；全局设了它会改掉 combine 的查找前缀。

jobs:
  # ================================================================ ① 静态与契约
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 代码规范（ruff：import 顺序 / 未用变量 / 未定义名）
        run: python -m ruff check src tests scripts

      - name: 语法编译（compileall，早于测试快速失败）
        run: python -m compileall -q src scripts

      - name: 流水线自检（6 条 workflow 语义规则）
        run: python scripts/check_ci_config.py

      - name: 用例分组自检（每个用例恰好属于一个功能面）
        run: python scripts/ci_split.py --verify --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 前端冒烟·SKU 看板（web/）
        run: node scripts/ui_smoke.js

      - name: 前端冒烟·生图工作台（web/）
        run: node scripts/ui_smoke_image.js

  # ================================================================ ② 数据中台 + SKU Agent
  sku:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # 每个 step 一个功能面；失败时 annotations 里直接给出挂了哪些用例
      - name: ②-a 中台·身份/作用域/契约/治理（data_platform 边界）
        run: python scripts/ci_test_group.py sku:platform

      - name: ②-b 中台·指标口径/数据质量/巡检/可观测
        run: python scripts/ci_test_group.py sku:data

      - name: ②-c Agent·图/路由/技能/工具面/checkpoint
        run: python scripts/ci_test_group.py sku:graph

      - name: ②-d Agent·取数分析/档案/前端页面
        run: python scripts/ci_test_group.py sku:analysis

      - name: ②-e RAG·检索/引用溯源/评测语料
        run: python scripts/ci_test_group.py sku:rag

      - name: ②-f 记忆与会话/流式
        run: python scripts/ci_test_group.py sku:memory

      - name: ②-g 基础设施·LLM 传输/缓存/并发/队列/MCP
        run: python scripts/ci_test_group.py sku:infra

      - name: 上传覆盖率分片
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sku
          path: .coverage.sku.*
          # .coverage.* 是隐藏文件，upload-artifact v4.4+ 默认跳过隐藏文件
          include-hidden-files: true
          if-no-files-found: error

  # ================================================================ ③ 生图 Agent
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: ③-a 规划/Prompt/商品上下文（agents_image/nodes·sources）
        run: python scripts/ci_test_group.py image:plan

      - name: ③-b 生成/重试/并发/成本（agents_image/generator·providers）
        run: python scripts/ci_test_group.py image:generate

      - name: ③-c 门禁/Critic/像素/校验（agents_image/compliance·critic）
        run: python scripts/ci_test_group.py image:gate

      - name: ③-d Reflexion/修复库/RAG（agents_image/repair·rag）
        run: python scripts/ci_test_group.py image:reflexion

      - name: ③-e 任务状态机/可靠性/幂等/配额/结算（agents_image/store）
        run: python scripts/ci_test_group.py image:task

      - name: ③-f worker 契约/存储/服务化/中台回写（agents_image/worker）
        run: python scripts/ci_test_group.py image:worker

      - name: ③-g API/前端/指标/资源/批量（agents_image/api）
        run: python scripts/ci_test_group.py image:api

      - name: 上传覆盖率分片
        uses: actions/upload-artifact@v4
        with:
          name: coverage-image
          path: .coverage.image.*
          include-hidden-files: true
          if-no-files-found: error

  # ================================================================ ④ 覆盖率门槛
  coverage:
    needs: [sku, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 汇总两个分片
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .

      - name: 合并 + 覆盖率门槛（≥ 80%，口径不变）
        run: |
          set -o pipefail
          ls -l .coverage* || true
          { python -m coverage combine && python -m coverage report --fail-under=80 --show-missing; } \
            2>&1 | tee coverage-gate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then python scripts/ci_annotate.py coverage-gate.log; fi
          exit "$status"

  # ================================================================ ⑤ 评测/自检门槛
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # 检索评测读的是真实库里的 kb_chunk（知识库索引），全新 checkout 里还没有这张表，
      # 所以先跑一次初始化（建表 + 300 SKU + KB 索引；data/ 是 gitignored，不会污染仓库）。
      - name: 初始化演示数据（评测门槛需要知识库索引）
        run: python scripts/init_db.py

      - name: ⑤-a 答案质量判定器自检（离线、确定性）
        run: python scripts/eval_agent_answers.py --offline

      - name: ⑤-b 检索评测门槛（Recall@1 ≥ 0.8）
        run: python scripts/eval_rag.py --min-recall 0.8

      - name: ⑤-c 路由准确率门槛（≥ 0.9）
        run: python scripts/eval_routing.py --min-accuracy 0.9

      - name: ⑤-d 工具部门作用域门槛（27 工具 × 3 账号 / 34 用例，必须 100%）
        run: python scripts/eval_permissions.py --min-pass 1.0

      - name: ⑤-e 出口溯源闸门门槛（准确率 ≥ 0.9、误杀率 ≤ 0.1）
        run: python scripts/eval_grounding.py --max-false-positive 0.1

      - name: ⑤-f 中台治理门槛（身份/scope/部门/配额/审计/并发，必须 100%）
        run: python scripts/eval_platform_governance.py --min-pass 1.0

      - name: ⑤-g 工具面/写路径门禁（描述+参数说明/幂等键/未知工具契约/证据下限/聚合口径）
        run: python scripts/eval_agent_tooling.py --min-pass 1.0

      - name: ⑤-h 并发写自检（两个 agent 写同一份档案不静默覆盖）
        run: python scripts/verify_concurrent_writes.py

  # ================================================================ ⑥ 生产库方言
  # 只跑 SQLite 的话，MySQL 方言（ensure_columns 的 CREATE INDEX、utf8mb4、事务隔离）
  # 从来没被验证过。这里用 service container 跑关键子集。
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sku_ci
          MYSQL_USER: sku
          MYSQL_PASSWORD: sku
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usku -psku"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      TEST_DATABASE_URL: mysql+pymysql://sku:sku@127.0.0.1:3306/sku_ci?charset=utf8mb4
      TEST_SEED_SKUS: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # 容器健康检查只看 `mysqladmin ping`，它在 mysqld 刚起、还没建好表空间时也可能通；
      # 测试里第一步就是 init_schema，抢跑会整片红（历史故障：job 只跑了 71 秒）。
      # 这里用 pymysql（本来就是依赖）真连一次库再放行，最多等 90 秒。
      - name: 等待 MySQL 真正可连（不只看 healthcheck）
        run: |
          python - <<'PY'
          import sys
          import time

          import pymysql

          last = None
          for attempt in range(1, 91):
              try:
                  conn = pymysql.connect(host="127.0.0.1", port=3306, user="sku", password="sku",
                                         database="sku_ci", connect_timeout=3)
                  with conn.cursor() as cur:
                      cur.execute("SELECT 1")
                      cur.fetchone()
                  conn.close()
                  print(f"MySQL 可连（第 {attempt} 次尝试）")
                  break
              except Exception as exc:  # noqa: BLE001
                  last = exc
                  time.sleep(1)
          else:
              print(f"MySQL 90 秒内仍不可连：{last!r}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: ⑥ 档案/巡检/接口/记忆/检索索引/看板 + 中台治理（MySQL 方言）
        run: |
          set -o pipefail
          python -m pytest -q -rf \
            tests/test_analysis_idempotent.py \
            tests/test_analysis_concurrency.py \
            tests/test_patrol.py \
            tests/test_api.py \
            tests/test_chat_store.py \
            tests/test_memory_layers.py \
            tests/test_rag_index_reconcile.py \
            tests/test_screening.py \
            tests/test_metrics_cards.py \
            tests/test_platform.py \
            tests/test_platform_authz.py \
            tests/test_platform_governance.py \
            tests/test_platform_replenish_idem.py \
            tests/test_demo_catalog_contract.py \
            2>&1 | tee pytest-mysql.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then python scripts/ci_annotate.py pytest-mysql.log; fi
          exit "$status"
