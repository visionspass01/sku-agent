task_id: "20261117153045a3f9"     # 18 位任务 ID
batch_id: "20261117153040b7c1"    # 一次批量请求共享
product_id: "P-1001"              # 本任务商品（来自中台）
platform: "淘系"
aspect: "1:1"
count: 2
slots:
