    text_policy: "none"           # none | headline | spec（铁律⑥）
    preserve: ["颜色", "版型", "图案", "logo 文字", "关键部件位置"]   # 铁律④
    fragments: []                 # RAG 命中的写法片段（D10）
    prompt: "五槽位 Prompt 全文"
    negative_prompt: "文字水印、边框、拼图、多余物件、改变款式与颜色"
