upstream sku_agent_app {
    server app:8000;
    keepalive 16;
}

upstream sku_agent_platform {
    server platform:8001;
    keepalive 16;
}

# 主站：Web 看板（Agent 服务）
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://sku_agent_app;
    }
}

# 数据中台 REST API（需请求头 X-Internal-Token，默认仅本机/内网演示使用）
server {
    listen 500;
    server_name _;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://sku_agent_platform;
    }
}

# 443：仅为「浏览器默认用 https 打开 IP」这一常见情况兜底——握手成功后立即 301 到 http。
# 证书由 `scripts/gen_redirect_cert.sh` 在部署时自签生成（docker/certs/，不入库）；
# 浏览器会提示一次「不安全」，继续访问后即跳到 http 首页。
# 需要真正的 HTTPS（正式证书 + HSTS）请改用 docker-compose.https.yml + nginx-https.conf。
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/redirect-selfsigned.pem;
    ssl_certificate_key /etc/nginx/certs/redirect-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 用 $host 保留原始 Host（IP 或域名），只跳协议不跳路径
    return 301 http://$host$request_uri;
}
