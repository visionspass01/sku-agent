name: sku-agent

# HTTPS 覆盖文件：与 docker-compose.deploy.yml 一起使用（正式 HTTPS，不是兜底跳转）
# 用法：
#   1) 将证书放到 docker/certs/fullchain.pem 与 docker/certs/privkey.pem
#      （路径可用变量 REAL_CERT_DIR 指向别处；该目录已在 .gitignore 中，私钥不入库）
#   2) docker compose --env-file .env -f docker/docker-compose.deploy.yml \
#        -f docker/docker-compose.https.yml up -d
#
# 说明：基础文件已映射 443:443 与 ./certs 挂载，本覆盖文件只替换 nginx 配置
# （nginx-https.conf：80 端口 301 到 443 + 443 挂真实证书）。因此这里不再重复声明端口，
# 避免端口列表被合并成重复条目。
services:
  nginx:
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
